name: Bogue · Bug report
description: Quelque chose ne fonctionne pas comme prévu. · Something doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Écrivez en français ou en anglais. · Write in French or English.

        Si le problème touche la sécurité, fermez ce formulaire et suivez plutôt
        [SECURITY.md](https://github.com/olivierouellet/Degel-Carte/blob/main/SECURITY.md).
        · If the bug has a security side, close this and use SECURITY.md instead.

  - type: textarea
    id: what-happened
    attributes:
      label: Ce qui s’est passé · What happened
      description: Ce que vous avez fait, ce que vous avez vu, et ce que vous attendiez. · What you did, what you saw, and what you expected.
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Source des données · Data source
      options:
        - Intégration Dégel · Dégel integration
        - Directement de Transports Québec · Directly from Transports Québec
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration de la carte (YAML) · Card configuration (YAML)
      render: yaml
    validations:
      required: false

  - type: dropdown
    id: zones
    attributes:
      label: Zones suivies · Followed zones
      multiple: true
      options:
        - Zone 1
        - Zone 2
        - Zone 3
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Versions
      description: Dégel-Carte, Home Assistant et le navigateur ou l’application. · Dégel-Carte, Home Assistant and the browser or app.
      placeholder: Dégel-Carte 1.0.0, Home Assistant 2026.10.1, Safari 26 / Companion iOS
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console du navigateur · Browser console
      description: >
        Les lignes qui mentionnent « Dégel-Carte » dans la console du navigateur. ·
        Lines mentioning "Dégel-Carte" in the browser console.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Avant d’envoyer · Before submitting
      options:
        - label: Ce n’est pas un problème de sécurité. · This is not a security issue.
          required: true
